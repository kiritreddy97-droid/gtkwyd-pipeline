name: explainer

# Daily "how it's made / how it works" explainer Shorts for any product:
#   English -> the main YouTube channel + Instagram (Reel and Story)
#   Telugu  -> the Telugu YouTube channel
# A new product each day from topics-explainers.txt (Gemini adds more when it runs low).
# Starts from 12:20 PM US Eastern; later cron triggers are backups, the gate lets the first
# one that finds work do it and the rest exit in seconds.
on:
  schedule:
    - cron: "20 16 * * *"   # 12:20 EDT
    - cron: "20 17 * * *"   # 12:20 EST
    - cron: "50 19 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "en, te or both"
        default: "both"
      topic:
        description: "a specific product, for testing (optional)"
        default: ""
      look:
        description: "stylized (default) = game-engine look + step labels, classic = old look"
        default: "stylized"
      dry_run:
        description: "render only, do not upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gtkwyd-explainer
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        run: python3 explainer_gate.py

  explainer:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: pip install -q -r requirements.txt
      - name: Install image-generation libraries (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements-ai.txt
      - name: Cache the image model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-image-model-sdxl-turbo
      - name: Cache music library
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-library-v1
      - name: Download music library
        if: steps.cache-music.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/music
          gh release download music-v1 --repo "${{ github.repository }}" \
            --pattern "music-library.zip" --output music-library.zip
          unzip -q music-library.zip -d assets/music
          rm music-library.zip
      - name: Write config.toml
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          sed -e "s#^pexels_key = .*#pexels_key = \"$PEXELS_KEY\"#" \
              -e "s#^pixabay_key = .*#pixabay_key = \"$PIXABAY_KEY\"#" \
              config.example.toml > config.toml
      - name: Write YouTube credentials (English + Telugu channels)
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_TE_TOKEN: ${{ secrets.YT_TE_TOKEN }}
        run: |
          [ -n "$YT_CLIENT_SECRET" ] && printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          [ -n "$YT_TOKEN" ] && printf '%s' "$YT_TOKEN" > youtube_token.json
          [ -n "$YT_TE_TOKEN" ] && printf '%s' "$YT_TE_TOKEN" > youtube_token_te.json
          python3 - <<'PY'
          import json, os
          for f in ('client_secret.json', 'youtube_token.json', 'youtube_token_te.json'):
              if os.path.exists(f):
                  t = open(f, encoding='utf-8-sig').read().strip()
                  json.loads(t)
                  open(f, 'w', encoding='utf-8').write(t)
                  print(f, 'validated OK')
          PY
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LANGS="${{ inputs.lang }}"
            DRY="${{ inputs.dry_run }}"
          else
            LANGS=both
            DRY=false
          fi
          if [ "$DRY" = "true" ]; then
            python explainer_daily.py --lang "$LANGS" --dry-run --topic "${{ inputs.topic }}" --look "${{ inputs.look }}"
          else
            python explainer_daily.py --lang "$LANGS"
          fi
      - name: Upload rendered files for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-rendered
          path: build/*/*.mp4
          retention-days: 2
          if-no-files-found: ignore
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "gtkwyd-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in history-explainer.jsonl topics-explainers.txt topics_used.txt \
                   scripts/_generated-explainers; do
            git add "$p" 2>/dev/null || true
          done
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "explainer: run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, fetching + rebasing (attempt $i) ..."
            git fetch origin main
            git checkout -- .
            git rebase origin/main || { git rebase --abort; sleep $((i * 3)); continue; }
            sleep 2
          done
          echo "::error::could not push updated state after retries"
          exit 1