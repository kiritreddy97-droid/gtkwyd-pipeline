name: imagebench

# One-off benchmark (manual only): how fast / how good is an open-source image
# model on a free CPU runner? Results are uploaded as an artifact.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdxl-turbo
      - name: Install CPU PyTorch + diffusers
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors
          nproc; free -g | head -2
      - name: Benchmark
        run: python scripts/bench_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagebench
          path: out/imagebench/*
          retention-days: 3
