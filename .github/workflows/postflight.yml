name: postflight

# Runs ~10 minutes after each real publish slot and confirms something with a
# matching, recent, successful entry actually landed in history.jsonl -
# instead of just assuming the scheduled run worked. If it didn't: retries
# the publish once automatically (handles a transient blip on its own) and
# files a GitHub Issue either way so a real failure is visible within
# minutes, not discovered days later by scrolling the channel.
on:
  schedule:
    - cron: "17 15 * * 1-5"   # 10 min after video-am    (15:07 UTC)
    - cron: "14 21 * * 1-5"   # 10 min after video-pm    (21:04 UTC)
    - cron: "19 14 * * 1-5"   # 10 min after short-8am   (14:09 UTC)
    - cron: "22 20 * * 1-5"   # 10 min after short-2pm   (20:12 UTC)
    - cron: "17 2 * * 2-6"    # 10 min after short-8pm   (02:07 UTC, see publish.yml's day-shift note)
    - cron: "44 8 * * 1-5"    # 10 min after short-2am   (08:34 UTC)
  workflow_dispatch:
    inputs:
      format:
        type: choice
        options: [video, short]
        default: video

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  postflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine which slot just ran
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=manual"; echo "format=${{ inputs.format }}"; echo "source=auto"
          else
            case "${{ github.event.schedule }}" in
              "17 15 * * 1-5") echo "name=video-am";  echo "format=video"; echo "source=news" ;;
              "14 21 * * 1-5") echo "name=video-pm";  echo "format=video"; echo "source=auto" ;;
              "19 14 * * 1-5") echo "name=short-8am"; echo "format=short"; echo "source=auto" ;;
              "22 20 * * 1-5") echo "name=short-2pm"; echo "format=short"; echo "source=auto" ;;
              "17 2 * * 2-6")  echo "name=short-8pm"; echo "format=short"; echo "source=auto" ;;
              "44 8 * * 1-5")  echo "name=short-2am"; echo "format=short"; echo "source=auto" ;;
              *)                echo "name=unknown";  echo "format=video"; echo "source=auto" ;;
            esac
          fi >> "$GITHUB_OUTPUT"

      - name: Check whether it actually published
        id: check
        continue-on-error: true
        run: python -m pipeline.healthcheck postflight "${{ steps.slot.outputs.format }}" "${{ steps.slot.outputs.name }}"

      - name: On failure - retry once and file/update an issue
        id: on_failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Actions schedules can run hours late under load. If a publish
          # run for this slot is still queued/in-progress (i.e. it's late, not
          # failed), don't pile on a duplicate retry, don't file an issue, and
          # don't fail this job either (continue-on-error above lets us decide
          # that explicitly in the next step) - a delayed-but-working run must
          # never look like a real failure or send a "run failed" email for
          # nothing.
          INFLIGHT=$(gh run list --workflow=publish --json databaseId,status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="requested" or .status=="waiting")][0].databaseId // empty')
          if [ -n "$INFLIGHT" ]; then
            echo "Publish run $INFLIGHT is still in flight (delayed schedule) - not a real failure, skipping retry."
            echo "inflight=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "inflight=false" >> "$GITHUB_OUTPUT"

          TITLE="🔴 Publish failed: ${{ steps.slot.outputs.name }} ($(date -u +%Y-%m-%d))"
          EXISTING=$(gh issue list --search "in:title \"Publish failed: ${{ steps.slot.outputs.name }}\" is:open" --json number,body --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "The **${{ steps.slot.outputs.name }}** slot did not produce a successful upload within its expected window.

          Retrying it once automatically now. If you're reading this and it's still open, the retry also failed and this needs a look:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --label "pipeline-health"

            echo "First failure for this slot today - triggering one automatic retry."
            gh workflow run publish -f format="${{ steps.slot.outputs.format }}" -f source="${{ steps.slot.outputs.source }}"
          else
            gh issue comment "$EXISTING" --body "Still failing after the automatic retry. This needs a person (or Claude) to look at the actual error - check the Actions log:
          ${{ github.server_url }}/${{ github.repository }}/actions"
          fi

      - name: Fail the job only if this was a genuine failure
        if: steps.check.outcome == 'failure' && steps.on_failure.outputs.inflight != 'true'
        run: |
          echo "::error::postflight genuinely failed for ${{ steps.slot.outputs.name }} - see the 'Check whether it actually published' step above"
          exit 1

      - name: Close any open issue for this slot on success
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --search "in:title \"${{ steps.slot.outputs.name }}\" is:open" --json number --jq '.[].number' | \
          while read -r n; do
            gh issue comment "$n" --body "Resolved - the next run for this slot published successfully."
            gh issue close "$n"
          done
