name: publish

# Times below are UTC. The repo was set up for Mountain Time (UTC-6 MDT /
# UTC-7 MST) targeting 09:00 / 10:00 / 15:00 / 15:30 local. Cron is fixed UTC,
# so actual local time shifts by an hour across the Nov/Mar DST changes -
# that's fine, just expect the posts to land an hour earlier/later then.
on:
  schedule:
    # Off the exact hour/half-hour on purpose: GitHub's own docs warn that
    # schedules queued right at :00/:30 compete with everyone else's and are
    # the most likely to be delayed or dropped under load.
    - cron: "7 15 * * 1-5"    # video-am (tries science news first)
    - cron: "12 16 * * 1-5"   # short-am
    - cron: "4 21 * * 1-5"    # video-pm
    - cron: "37 21 * * 1-5"   # short-pm
  workflow_dispatch:
    inputs:
      format:
        description: "video or short"
        type: choice
        options: [video, short]
        default: video
      source:
        description: "auto or news"
        type: choice
        options: [auto, news]
        default: auto

permissions:
  contents: write

concurrency:
  group: gtkwyd-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Cache Piper binary
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-linux-x86_64-2023.11.14-2

      - name: Install Piper
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          curl -sL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          rm piper.tar.gz
      - run: chmod +x piper/piper

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-ljspeech-high

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-model

      - name: Cache music library
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-library-v1

      - name: Download music library
        if: steps.cache-music.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/music
          gh release download music-v1 --repo "${{ github.repository }}" \
            --pattern "music-library.zip" --output music-library.zip
          unzip -q music-library.zip -d assets/music
          rm music-library.zip
          echo "music tracks: $(find assets/music -name '*.mp3' | wc -l)"

      - name: Determine this run's slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=manual"                          >> "$GITHUB_OUTPUT"
            echo "format=${{ inputs.format }}"           >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}"           >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "7 15 * * 1-5")   echo "name=video-am"; echo "format=video"; echo "source=news" ;;
              "12 16 * * 1-5")  echo "name=short-am"; echo "format=short"; echo "source=auto" ;;
              "4 21 * * 1-5")   echo "name=video-pm"; echo "format=video"; echo "source=auto" ;;
              "37 21 * * 1-5")  echo "name=short-pm"; echo "format=short"; echo "source=auto" ;;
              *)
                # Safety net: an unrecognised schedule string (e.g. the cron
                # times above get edited again and this lookup isn't updated
                # to match) must never crash silently with an empty
                # --format. Fall back to a safe default instead.
                echo "::warning::unrecognised schedule '${{ github.event.schedule }}' - falling back to default slot"
                echo "name=schedule-fallback"; echo "format=video"; echo "source=auto" ;;
            esac >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ollama (news / AI slots only, best-effort)
        if: steps.slot.outputs.source == 'news'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 6
          ollama pull llama3.2:3b

      - name: Write config.toml
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          sed -e "s#^pexels_key = .*#pexels_key = \"$PEXELS_KEY\"#" \
              -e "s#^pixabay_key = .*#pixabay_key = \"$PIXABAY_KEY\"#" \
              -e 's#^visibility = .*#visibility = "public"#' \
              config.example.toml > config.toml

      - name: Write YouTube credentials
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > youtube_token.json
          # Defensively strip any BOM/whitespace and validate as JSON - a secret
          # copy-pasted from Windows can carry a leading BOM byte that breaks
          # Python's plain json.load().
          python3 -c "
          import json
          for f in ('client_secret.json', 'youtube_token.json'):
              t = open(f, encoding='utf-8-sig').read().strip()
              json.loads(t)
              open(f, 'w', encoding='utf-8').write(t)
          print('YouTube credential files validated OK')
          "

      - name: Run
        run: |
          python auto.py --slot "${{ steps.slot.outputs.name }}" \
                         --format "${{ steps.slot.outputs.format }}" \
                         --source "${{ steps.slot.outputs.source }}"

      # Keeps the actual rendered file around briefly so quality issues can be
      # checked directly (ffprobe/loudness) instead of guessed at. Cheap: a
      # few MB, 3-day retention, well under the free artifact storage limit.
      - name: Upload rendered file for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-output
          path: build/*/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "gtkwyd-bot"
          git config user.email "actions@users.noreply.github.com"
          # one path per "git add" - if any single path doesn't exist yet, git
          # aborts the WHOLE add for a multi-path invocation, silently dropping
          # paths that do exist and need staging (bit us once already).
          for p in history.jsonl topics_used.txt scripts/published \
                   scripts/review scripts/shorts-review \
                   scripts/_generated scripts/_generated-shorts; do
            git add "$p" 2>/dev/null || true
          done
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "auto: ${{ steps.slot.outputs.name }} run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # retry with rebase in case something else (another run, a manual
          # push) landed on main in the meantime - our change is a small,
          # mostly-additive diff so a rebase onto the latest tip applies clean.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, fetching + rebasing (attempt $i) ..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep $((i * 3)); continue; }
            sleep 2
          done
          echo "::error::could not push updated state after retries"
          exit 1
