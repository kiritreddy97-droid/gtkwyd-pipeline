name: reels

# Three separate daily Instagram-only Reels - satisfying, soothing, and
# fitness/wellness/nutrition - each on its own schedule slot (not a
# rotation). Times below are UTC, converted from Mountain Time (currently
# MDT, UTC-6), and picked clear of every other scheduled slot in this repo
# (video/short publish times, the instagram post-due checks, story.yml).
on:
  schedule:
    - cron: "17 18 * * 1-5"    # satisfying (~12:17pm Mountain)
    - cron: "26 19 * * 1-5"    # soothing   (~1:26pm Mountain)
    - cron: "38 22 * * 1-5"    # fitness    (~4:38pm Mountain)
  workflow_dispatch:
    inputs:
      category:
        description: "satisfying, soothing, or fitness"
        type: choice
        options: [satisfying, soothing, fitness]
        default: satisfying
      dry_run:
        description: "render only, do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gtkwyd-reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Cache Piper binary
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-linux-x86_64-2023.11.14-2

      - name: Install Piper
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          curl -sL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          rm piper.tar.gz
      - run: chmod +x piper/piper

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-ljspeech-high

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-model

      - name: Cache music library
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-library-v1

      - name: Download music library
        if: steps.cache-music.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/music
          gh release download music-v1 --repo "${{ github.repository }}" \
            --pattern "music-library.zip" --output music-library.zip
          unzip -q music-library.zip -d assets/music
          rm music-library.zip

      - name: Install Ollama (AI reel writer)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 6
          ollama pull llama3.2:3b

      - name: Write config.toml
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          sed -e "s#^pexels_key = .*#pexels_key = \"$PEXELS_KEY\"#" \
              -e "s#^pixabay_key = .*#pixabay_key = \"$PIXABAY_KEY\"#" \
              config.example.toml > config.toml

      - name: Determine this run's category
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=manual"                       >> "$GITHUB_OUTPUT"
            echo "category=${{ inputs.category }}"    >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "17 18 * * 1-5")  echo "name=satisfying"; echo "category=satisfying" ;;
              "26 19 * * 1-5")  echo "name=soothing";   echo "category=soothing" ;;
              "38 22 * * 1-5")  echo "name=fitness";    echo "category=fitness" ;;
              *)
                echo "::warning::unrecognised schedule '${{ github.event.schedule }}' - falling back"
                echo "name=schedule-fallback"; echo "category=satisfying" ;;
            esac >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          # Stages the rendered Reel as a public GitHub Release asset so
          # Instagram's API can fetch it by URL, then posts it directly via
          # the Graph API.
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python reels.py --slot "${{ steps.slot.outputs.name }}" \
                            --category "${{ steps.slot.outputs.category }}" --dry-run
          else
            python reels.py --slot "${{ steps.slot.outputs.name }}" \
                            --category "${{ steps.slot.outputs.category }}"
          fi

      - name: Upload rendered file for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reel-${{ steps.slot.outputs.category }}
          path: build/*/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "gtkwyd-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in history.jsonl topics_used.txt scripts/_generated-reels; do
            git add "$p" 2>/dev/null || true
          done
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "reels: ${{ steps.slot.outputs.name }} run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, fetching + rebasing (attempt $i) ..."
            git fetch origin main
            git checkout -- .
            git rebase origin/main || { git rebase --abort; sleep $((i * 3)); continue; }
            sleep 2
          done
          echo "::error::could not push updated state after retries"
          exit 1
