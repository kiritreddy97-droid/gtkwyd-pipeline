name: showcase

# Assembles a showcase video (your own clips, e.g. from Google Flow, plus voice, captions,
# title card and ending). Needs no AI picture models, so it runs in a few minutes.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "showcase folder"
        default: "showcase/glass-bottle"

permissions:
  contents: read

concurrency:
  group: gtkwyd-showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: pip install -q -r requirements.txt
      - name: Write config.toml
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          sed -e "s#^pexels_key = .*#pexels_key = \"$PEXELS_KEY\"#" \
              -e "s#^pixabay_key = .*#pixabay_key = \"$PIXABAY_KEY\"#" \
              config.example.toml > config.toml
      - name: Render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python showcase.py "${{ inputs.folder }}"
      - name: Upload rendered file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-rendered
          path: build/*/*.mp4
          retention-days: 3