name: telugu

# Telugu history-story channel, fully automatic, every day of the year:
# a new ~10-minute narrated story, a new ~60-second Short, and a new thumbnail,
# published from 12:00 PM US Eastern.
#
# GitHub cron is UTC-only and ignores daylight saving, so there are several
# triggers around/after noon ET (16:07 UTC = 12:07 EDT in summer, 17:07 UTC =
# 12:07 EST in winter, plus later backups in case GitHub drops or delays one).
# The cheap `gate` job lets the first run at/after 12:00 ET do the work and
# every later one exit in seconds, once today's story and Short are up.
#
# Needs repo secrets GEMINI_API_KEY and YT_TE_TOKEN (see AUTOMATION.md); without
# them a run logs a skip and exits cleanly.
on:
  schedule:
    - cron: "7 16 * * *"
    - cron: "7 17 * * *"
    - cron: "37 18 * * *"
    - cron: "7 20 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "daily (story + Short), long, short, selftest (renders a bundled sample, no Gemini/YouTube needed), or gemini-check (lists which Gemini models your key can use)"
        type: choice
        options: [daily, long, short, selftest, gemini-check, media-check]
        default: daily
      dry_run:
        description: "render only, do not upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gtkwyd-telugu
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        run: python3 telugu_gate.py

  telugu:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      # AI illustrations: CPU PyTorch + diffusers, and the cached image model
      # (~7 GB, downloaded once). Failure here only means stock-footage fallback.
      - name: Install image-generation libraries (CPU)
        continue-on-error: true
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements-ai.txt

      - name: Cache the image model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-image-model-sdxl-turbo

      - name: Cache music library
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music
          key: music-library-v1

      - name: Download music library
        if: steps.cache-music.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/music
          gh release download music-v1 --repo "${{ github.repository }}" \
            --pattern "music-library.zip" --output music-library.zip
          unzip -q music-library.zip -d assets/music
          rm music-library.zip

      - name: Determine this run's kind
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}"       >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}"     >> "$GITHUB_OUTPUT"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"
            echo "dry=false"  >> "$GITHUB_OUTPUT"
          fi

      - name: Write config.toml
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          sed -e "s#^pexels_key = .*#pexels_key = \"$PEXELS_KEY\"#" \
              -e "s#^pixabay_key = .*#pixabay_key = \"$PIXABAY_KEY\"#" \
              config.example.toml > config.toml

      - name: Write YouTube credentials (Telugu channel)
        env:
          YT_TE_TOKEN: ${{ secrets.YT_TE_TOKEN }}
        run: |
          if [ -n "$YT_TE_TOKEN" ]; then
            printf '%s' "$YT_TE_TOKEN" > youtube_token_te.json
            python3 -c "
          import json
          t = open('youtube_token_te.json', encoding='utf-8-sig').read().strip()
          json.loads(t)
          open('youtube_token_te.json', 'w', encoding='utf-8').write(t)
          print('Telugu channel credentials validated OK')
          "
          else
            echo "YT_TE_TOKEN not set - videos will render but not upload"
          fi

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ steps.kind.outputs.dry }}" = "true" ]; then
            python telugu.py --kind "${{ steps.kind.outputs.kind }}" --dry-run
          else
            python telugu.py --kind "${{ steps.kind.outputs.kind }}"
          fi

      - name: Upload rendered file for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telugu-rendered
          path: |
            build/*/*.mp4
            build/media-check/*
          retention-days: 2
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "gtkwyd-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in history-telugu.jsonl topics_used.txt topics-telugu-history.txt \
                   scripts/_generated-telugu scripts/telugu-shorts-queue scripts/published; do
            git add "$p" 2>/dev/null || true
          done
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "telugu: ${{ steps.kind.outputs.kind }} run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, fetching + rebasing (attempt $i) ..."
            git fetch origin main
            git checkout -- .
            git rebase origin/main || { git rebase --abort; sleep $((i * 3)); continue; }
            sleep 2
          done
          echo "::error::could not push updated state after retries"
          exit 1
