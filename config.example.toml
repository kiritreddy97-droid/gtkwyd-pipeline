# Copy this file to config.toml and fill in your API keys.
# config.toml is git-ignored so your keys stay private.

[project]
channel_name = "Get To Know What You Don't"
# "landscape" = 1920x1080 (normal videos)  |  "portrait" = 1080x1920 (Shorts)
orientation = "landscape"
fps = 30

[apis]
# Free, instant signup:  https://www.pexels.com/api/
pexels_key = ""
# Free, instant signup:  https://pixabay.com/api/docs/
pixabay_key = ""

[voice]
# Run  ./run.ps1 --list-voices  to see all options.
# true = pick a different smooth "-high" tier voice per video/Short from
# pipeline.voices.SMOOTH_POOL (mixed gender/accent), plus a small random
# jitter on pace and prosody each time - so the channel doesn't sound like
# the same take reused over and over. false = always use `model` below.
rotate = true
# Used only when rotate = false, or as the base "model" a script's own
# `voice:` line overrides. ljspeech-high = calm, measured audiobook-style
# narration - the smoothest, most "soothing" free Piper voice.
model = "en_US-ljspeech-high"
# >1.0 = slower/calmer narration, <1.0 = faster. Slightly slow reads calmer.
# (±0.04-0.05 random jitter is added per render on top of this.)
length_scale = 1.12
# Silence (seconds) inserted after each sentence - more air = calmer pacing.
sentence_silence = 0.5
# Piper's own expressiveness controls (defaults: 0.667 / 0.8). Small random
# jitter is added per render on top of these too.
noise_scale = 0.667
noise_w = 0.8

[visuals]
# "video" prefers stock clips, "image" prefers stills with a Ken Burns pan,
# "mix" alternates.
prefer = "video"

[captions]
enabled = true
max_words_per_line = 4
# Any font installed on Windows, or a .ttf placed in assets/fonts/
font = "Anton"
whisper_model = "base"   # tiny | base | small  (bigger = slower, more accurate)

[music]
# 0.0 - 1.0. Peak background music level. It gently ducks under narration
# and swells back up in the gaps - this is the swelled-up peak, the level
# under the voice will be noticeably but not silently lower.
volume = 0.32
# Louder still for Shorts (music needs to carry more of a 30-45s Short).
short_volume = 0.4

[auto]
# Used only by auto.py (the fully-automated runner). See AUTOMATION.md.
enabled = true
upload = true
# "private" (safest) | "unlisted" | "public"
visibility = "public"
# true  = AI-written scripts wait in scripts/review/ for your approval
# false = AI scripts publish straight to YouTube (guardrails are the only net)
require_review_for_ai = true
# Hard ceiling on uploads per calendar day (protects against runaway loops).
# The schedule itself only fires 4 times/day; this just leaves headroom for a
# manual catch-up run without silently refusing.
max_per_day = 6
# Local model for the AI writer (must be pulled in Ollama first).
# llama3.2:3b  - fast (~1-2 min/script), okay accuracy
# llama3.1:8b  - slower on CPU (~6-12 min), noticeably more reliable facts
ollama_model = "llama3.2:3b"
# Second pass: the model reviews its own script and it is rejected if it flags
# any shaky claim. Cheap insurance when require_review_for_ai = false.
self_review = true
# Optional: add every upload to this playlist.
playlist_id = ""
